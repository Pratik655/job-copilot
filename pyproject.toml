[project]
name = "jobcopilot"
version = "0.1.0"
description = "Review-first Bangalore software-engineer job copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32.0",
    "pypdf>=5.0.0",
]

[project.scripts]
jobcopilot = "jobcopilot.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobcopilot*"]
